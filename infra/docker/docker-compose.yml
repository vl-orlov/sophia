name: sophia

services:
  mariadb:
    image: mariadb:11.8.2
    container_name: sophia_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3312:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
